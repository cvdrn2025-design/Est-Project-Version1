<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimator Proyek (Multi-Proyek + File Name)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

    <style>
        .table-input { width: 100%; border-collapse: collapse; }
        .table-input th, .table-input td { padding: 10px; border: 1px solid #e5e7eb; text-align: center; }
        .table-input th { background-color: #f3f4f6; font-weight: 600; }
        input[type="number"] { width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; text-align: right; }
        input[type="text"] { width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; }
        
        .btn-action { color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; border: none; transition: 0.2s; }
        .btn-action:hover { opacity: 0.8; }
        .btn-green { background-color: #10b981; }
        .btn-blue { background-color: #3b82f6; }
        .btn-purple { background-color: #8b5cf6; }
        .btn-indigo { background-color: #6366f1; }
        .btn-orange { background-color: #f97316; }
        .btn-teal { background-color: #14b8a6; }
        .btn-gray { background-color: #6b7280; }
        .btn-danger { background-color: #ef4444; }

        .toast-msg { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: white; z-index: 50; transition: 0.3s; opacity: 0; pointer-events: none; }
        .toast-show { opacity: 1; pointer-events: auto; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0 !important; margin: 0 !important; }
            .max-w-5xl { box-shadow: none !important; border: none !important; border-radius: 0 !important; max-width: 100% !important; }
            .bg-slate-800 { background-color: #1f2937 !important; color: white !important; padding: 20px !important; }
            input[type="text"], input[type="number"] {
                border: none !important; background: transparent !important; padding: 0 !important; margin: 0 !important;
                font-weight: normal !important; text-align: center !important; width: 100% !important;
                -webkit-appearance: none !important; box-shadow: none !important;
            }
            .table-input th, .table-input td { border: 1px solid #000 !important; }
            .subtotal { font-weight: bold !important; }
            .btn-action, select { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">

    <div id="toast" class="toast-msg bg-green-600 shadow-lg"></div>

    <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-xl overflow-hidden">
        <div class="bg-slate-800 text-white p-6">
            <h1 class="text-2xl font-bold">📂 Estimator Biaya Proyek (Multi File)</h1>
            <p class="text-slate-300 text-sm mt-1">Buat proyek baru, simpan dengan nama unik, dan panggil lagi kapan saja.</p>
        </div>

        <div class="p-6">
            
            <!-- Input Identitas & Kontrol Proyek -->
            <div class="mb-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama Proyek (Nama File)</label>
                    <div class="flex gap-2 mt-1">
                        <input type="text" id="namaProyek" placeholder="Contoh: Rumah Pak Heri" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-2 focus:ring-blue-500 outline-none">
                        <button onclick="tambahProyekBaru()" class="btn-action btn-green px-4 text-sm whitespace-nowrap">➕ Proyek Baru</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Pilih Proyek Tersimpan</label>
                    <select id="pilihProyek" class="w-full mt-1 border-gray-300 rounded-lg p-2 border focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        <option value="">-- Pilih Proyek --</option>
                    </select>
                </div>
            </div>

            <hr class="my-6 border-gray-200">

            <!-- Tabel Input -->
            <div class="overflow-x-auto">
                <table class="table-input text-sm" id="itemTable">
                    <thead>
                        <tr>
                            <th style="width: 5%;">No</th>
                            <th style="width: 35%;">Nama Pekerjaan / Material</th>
                            <th style="width: 15%;">Volume</th>
                            <th style="width: 15%;">Satuan</th>
                            <th style="width: 15%;">Harga Satuan (Rp)</th>
                            <th style="width: 15%;">Total Harga (Rp)</th>
                            <th class="no-print" style="width: 5%;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Action Buttons Utama -->
            <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-3 no-print">
                <button onclick="tambahBaris()" class="btn-action btn-green col-span-2 md:col-span-1">➕ Tambah Baris</button>
                <button onclick="resetForm()" class="btn-action btn-gray col-span-2 md:col-span-1">🔄 Reset Baris</button>
                <button onclick="exportToExcel()" class="btn-action btn-orange col-span-2 md:col-span-1">📥 Export Excel</button>
                <button onclick="window.print()" class="btn-action btn-teal col-span-2 md:col-span-1">🖨️ Print / PDF</button>
            </div>
            
            <!-- Group Tombol Simpan & Ambil dengan Dropdown -->
            <div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-4 no-print">
                <!-- Simpan -->
                <div class="flex flex-col md:flex-row gap-2">
                    <select id="simpanTarget" class="border border-gray-300 rounded-md p-2 text-sm flex-1 bg-white focus:ring-2 focus:ring-purple-500 outline-none">
                        <option value="browser" selected>💾 Simpan ke Browser</option>
                        <option value="server">☁️ Simpan ke Server</option>
                    </select>
                    <button onclick="simpanData()" class="btn-action btn-purple flex-1">Simpan Data</button>
                </div>

                <!-- Ambil -->
                <div class="flex flex-col md:flex-row gap-2">
                    <select id="ambilSource" class="border border-gray-300 rounded-md p-2 text-sm flex-1 bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="browser" selected>📂 Ambil dari Browser</option>
                        <option value="server">📂 Ambil dari Server</option>
                    </select>
                    <button onclick="ambilData()" class="btn-action btn-indigo flex-1">Ambil Data</button>
                </div>
            </div>

            <!-- Area Hasil -->
            <div class="mt-8 p-6 bg-slate-50 border border-slate-200 rounded-xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <div class="text-sm text-gray-500 uppercase tracking-wider">Grand Total Proyek</div>
                        <div id="grandTotalDisplay" class="text-3xl font-bold text-blue-700 mt-1">Rp 0</div>
                    </div>
                    <div>
                        <div class="text-sm text-gray-500 uppercase tracking-wider">Jumlah Item Pekerjaan</div>
                        <div id="jumlahItemDisplay" class="text-3xl font-bold text-gray-700 mt-1">0 Item</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let barisCounter = 0;
        const API_URL = 'http://localhost:3000';

        function showToast(msg, color = 'bg-green-600') {
            const t = document.getElementById('toast');
            t.className = `toast-msg ${color} shadow-lg`;
            t.innerText = msg;
            setTimeout(() => t.classList.add('toast-show'), 10);
            setTimeout(() => t.classList.remove('toast-show'), 3000);
        }

        // --- TABLE LOGIC ---
        function tambahBaris() {
            barisCounter++;
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${barisCounter}</td>
                <td><input type="text" class="nama-item" placeholder="Contoh: Besi D13"></td>
                <td><input type="number" class="volume" step="0.01" min="0" placeholder="0"></td>
                <td><input type="text" class="satuan" placeholder="kg / m² / unit"></td>
                <td><input type="number" class="harga-satuan" step="100" min="0" placeholder="0"></td>
                <td><span class="subtotal font-bold text-gray-700">0</span></td>
                <td class="no-print"><button onclick="hapusBaris(this)" class="btn-danger text-white px-2 py-1 rounded text-xs">Hapus</button></td>
            `;
            tbody.appendChild(tr);
            tr.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', function() { hitungBaris(this.closest('tr')); });
            });
            hitungSemua();
        }

        function hitungBaris(row) {
            const volume = parseFloat(row.querySelector('.volume').value) || 0;
            const hargaSatuan = parseFloat(row.querySelector('.harga-satuan').value) || 0;
            row.querySelector('.subtotal').innerText = (volume * hargaSatuan).toLocaleString('id-ID', {minimumFractionDigits: 0});
            hitungSemua();
        }

        function hapusBaris(btn) {
            const row = btn.closest('tr');
            row.remove();
            document.querySelectorAll('#tableBody tr').forEach((r, i) => r.cells[0].innerText = i + 1);
            barisCounter = document.querySelectorAll('#tableBody tr').length;
            hitungSemua();
        }

        function hitungSemua() {
            let grandTotal = 0;
            document.querySelectorAll('#tableBody tr').forEach(row => {
                const v = parseFloat(row.querySelector('.volume').value) || 0;
                const h = parseFloat(row.querySelector('.harga-satuan').value) || 0;
                grandTotal += v * h;
            });
            document.getElementById('grandTotalDisplay').innerText = 'Rp ' + grandTotal.toLocaleString('id-ID', {minimumFractionDigits: 0});
            document.getElementById('jumlahItemDisplay').innerText = document.querySelectorAll('#tableBody tr').length + ' Item';
        }

        function resetForm() {
            if(!confirm('Yakin ingin mereset semua baris data?')) return;
            document.getElementById('tableBody').innerHTML = '';
            document.getElementById('grandTotalDisplay').innerText = 'Rp 0';
            document.getElementById('jumlahItemDisplay').innerText = '0 Item';
            barisCounter = 0;
            tambahBaris();
        }

        // --- DATA UTILITIES ---
        function getTableData() {
            const data = [];
            document.querySelectorAll('#tableBody tr').forEach(row => {
                data.push({
                    nama: row.querySelector('.nama-item').value,
                    volume: parseFloat(row.querySelector('.volume').value) || 0,
                    satuan: row.querySelector('.satuan').value,
                    hargaSatuan: parseFloat(row.querySelector('.harga-satuan').value) || 0,
                    total: (parseFloat(row.querySelector('.volume').value) || 0) * (parseFloat(row.querySelector('.harga-satuan').value) || 0)
                });
            });
            return data;
        }

        function loadDataToTable(data) {
            document.getElementById('tableBody').innerHTML = '';
            barisCounter = 0;
            data.items.forEach(item => {
                tambahBaris();
                const row = document.querySelector('#tableBody tr:last-child');
                row.querySelector('.nama-item').value = item.nama || '';
                row.querySelector('.volume').value = item.volume || 0;
                row.querySelector('.satuan').value = item.satuan || '';
                row.querySelector('.harga-satuan').value = item.hargaSatuan || 0;
                hitungBaris(row);
            });
            document.getElementById('namaProyek').value = data.namaProyek || '';
            document.getElementById('namaKlien').value = data.namaKlien || '';
            hitungSemua();
        }

        // --- PROYEK BARU & DROPDOWN LIST ---
        function updateDropdownList() {
            const select = document.getElementById('pilihProyek');
            const list = JSON.parse(localStorage.getItem('proyekList')) || [];
            select.innerHTML = '<option value="">-- Pilih Proyek --</option>';
            list.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                select.appendChild(opt);
            });
        }

        function tambahProyekBaru() {
            document.getElementById('namaProyek').value = '';
            document.getElementById('namaKlien').value = '';
            document.getElementById('tableBody').innerHTML = '';
            document.getElementById('grandTotalDisplay').innerText = 'Rp 0';
            document.getElementById('jumlahItemDisplay').innerText = '0 Item';
            barisCounter = 0;
            tambahBaris();
            showToast('Proyek baru siap, silakan beri nama dan isi datanya!', 'bg-green-600');
        }

        // --- SIMPAN KE BROWSER (MULTI-FILE) ---
        function simpanData() {
            const target = document.getElementById('simpanTarget').value;
            if (target === 'browser') simpanKeLocal();
            else if (target === 'server') simpanKeServer();
        }

        function simpanKeLocal() {
            const proyekName = document.getElementById('namaProyek').value.trim();
            if (!proyekName) return showToast('Nama Proyek wajib diisi!', 'bg-red-600');

            const data = {
                namaProyek: proyekName,
                namaKlien: document.getElementById('namaKlien').value,
                items: getTableData()
            };

            // Simpan data dengan nama sebagai key
            localStorage.setItem('proyek_' + proyekName, JSON.stringify(data));

            // Update daftar proyek
            let list = JSON.parse(localStorage.getItem('proyekList')) || [];
            if (!list.includes(proyekName)) {
                list.push(proyekName);
                localStorage.setItem('proyekList', JSON.stringify(list));
                updateDropdownList();
            }
            showToast('Data tersimpan dengan nama file: "' + proyekName + '"!', 'bg-purple-600');
        }

        // --- AMBIL DARI BROWSER (MULTI-FILE) ---
        function ambilData() {
            const source = document.getElementById('ambilSource').value;
            if (source === 'browser') ambilDariLocal();
            else if (source === 'server') ambilDariServer();
        }

        function ambilDariLocal() {
            const selectedName = document.getElementById('pilihProyek').value;
            if (!selectedName) return showToast('Silakan pilih proyek dari dropdown!', 'bg-red-600');

            const raw = localStorage.getItem('proyek_' + selectedName);
            if (!raw) return showToast('Data proyek "' + selectedName + '" tidak ditemukan.', 'bg-red-600');

            const data = JSON.parse(raw);
            loadDataToTable(data);
            showToast('Memuat proyek "' + selectedName + '"!', 'bg-purple-600');
        }

        // --- SERVER SIDE (SAMA SEPERTI SEBELUMNYA) ---
        async function simpanKeServer() {
            const data = {
                namaProyek: document.getElementById('namaProyek').value,
                namaKlien: document.getElementById('namaKlien').value,
                items: getTableData()
            };
            try {
                const res = await fetch(`${API_URL}/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                showToast(result.message || 'Data berhasil disimpan ke Server!', 'bg-indigo-600');
            } catch (err) {
                showToast('Gagal simpan ke Server. Pastikan Node.js berjalan (http://localhost:3000)', 'bg-red-600');
            }
        }

        async function ambilDariServer() {
            try {
                const res = await fetch(`${API_URL}/load`);
                const data = await res.json();
                if (!data.items || data.items.length === 0) {
                    return showToast('Server kosong atau belum ada data.', 'bg-red-600');
                }
                loadDataToTable(data);
                showToast('Data berhasil dimuat dari Server!', 'bg-indigo-600');
            } catch (err) {
                showToast('Gagal ambil data dari Server. Pastikan Node.js berjalan.', 'bg-red-600');
            }
        }

        // --- EXPORT EXCEL ---
        function exportToExcel() {
            const rows = document.querySelectorAll('#tableBody tr');
            if (rows.length === 0) return showToast('Tidak ada data untuk di-export!', 'bg-red-600');

            const dataForExcel = [['No', 'Nama Pekerjaan', 'Volume', 'Satuan', 'Harga Satuan (Rp)', 'Total Harga (Rp)']];
            rows.forEach(row => {
                const no = row.cells[0].innerText;
                const nama = row.querySelector('.nama-item').value;
                const volume = row.querySelector('.volume').value;
                const satuan = row.querySelector('.satuan').value;
                const harga = row.querySelector('.harga-satuan').value;
                const total = row.querySelector('.subtotal').innerText.replace(/\./g, '');
                dataForExcel.push([no, nama, volume, satuan, harga, total]);
            });

            const grandTotal = document.getElementById('grandTotalDisplay').innerText;
            dataForExcel.push(['', '', '', '', 'GRAND TOTAL', grandTotal]);

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(dataForExcel);
            ws['!cols'] = [{ wch: 5 }, { wch: 40 }, { wch: 15 }, { wch: 15 }, { wch: 20 }, { wch: 20 }];
            XLSX.utils.book_append_sheet(wb, ws, "Estimasi Proyek");
            
            const fileName = `Estimasi_${document.getElementById('namaProyek').value || 'Proyek'}.xlsx`;
            XLSX.writeFile(wb, fileName);
            showToast('Berhasil export ke Excel!', 'bg-orange-600');
        }

        // --- INIT ---
        window.onload = function() {
            updateDropdownList();
            tambahBaris();
            // Cek jika ada dropdown yang dipilih dari sebelumnya
            const saved = localStorage.getItem('estimatorProjectData'); // Fallback legacy
            if (saved) {
                const data = JSON.parse(saved);
                loadDataToTable(data);
            }
        };
    </script>
</body>
</html>
