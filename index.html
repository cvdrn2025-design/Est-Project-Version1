<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Estimator Proyek (Blank)</title>
    
    <!-- CSS Framework via CDN untuk styling cepat (opsional, bisa dihapus jika ingin CSS manual) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CSS Custom (Jika diperlukan) -->
    <style>
        .table-input { width: 100%; border-collapse: collapse; }
        .table-input th, .table-input td { padding: 10px; border: 1px solid #e5e7eb; text-align: center; }
        .table-input th { background-color: #f3f4f6; font-weight: 600; }
        input[type="number"] { width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; text-align: right; }
        input[type="text"] { width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; }
        .btn-action { background-color: #3b82f6; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; border: none; }
        .btn-action:hover { background-color: #2563eb; }
        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">

    <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-xl overflow-hidden">
        <!-- Header Aplikasi -->
        <div class="bg-slate-800 text-white p-6">
            <h1 class="text-2xl font-bold">📊 Estimator Biaya Proyek</h1>
            <p class="text-slate-300 text-sm mt-1">Masukkan item pekerjaan, volume, dan harga satuan.</p>
        </div>

        <!-- Bagian Input -->
        <div class="p-6">
            
            <!-- Form Input Data -->
            <div class="mb-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama Proyek</label>
                    <input type="text" id="namaProyek" placeholder="Contoh: Renovasi Rumah" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-2 focus:ring-blue-500 outline-none mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama Klien / Owner</label>
                    <input type="text" id="namaKlien" placeholder="Contoh: Bapak Heri" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-2 focus:ring-blue-500 outline-none mt-1">
                </div>
            </div>

            <hr class="my-6 border-gray-200">

            <!-- Tabel Dinamis Input Item -->
            <div class="overflow-x-auto">
                <table class="table-input text-sm" id="itemTable">
                    <thead>
                        <tr>
                            <th style="width: 5%;">No</th>
                            <th style="width: 35%;">Nama Pekerjaan / Material</th>
                            <th style="width: 15%;">Volume</th>
                            <th style="width: 15%;">Satuan</th>
                            <th style="width: 15%;">Harga Satuan (Rp)</th>
                            <th style="width: 15%;">Total Harga (Rp)</th>
                            <th style="width: 5%;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Baris akan ditambahkan secara dinamis oleh JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Tombol Tambah & Hitung -->
            <div class="mt-4 flex flex-col md:flex-row gap-4">
                <button onclick="tambahBaris()" class="btn-action bg-green-600 hover:bg-green-700 flex-1">
                    ➕ Tambah Baris Pekerjaan
                </button>
                <button onclick="hitungSemua()" class="btn-action bg-blue-600 hover:bg-blue-700 flex-1">
                    🧮 Hitung Total Akhir
                </button>
                <button onclick="resetForm()" class="btn-action bg-gray-500 hover:bg-gray-600 flex-1">
                    🔄 Reset / Kosongkan
                </button>
            </div>

            <!-- Area Hasil Kalkulasi -->
            <div class="mt-8 p-6 bg-slate-50 border border-slate-200 rounded-xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <div class="text-sm text-gray-500 uppercase tracking-wider">Grand Total Proyek</div>
                        <div id="grandTotalDisplay" class="text-3xl font-bold text-blue-700 mt-1">Rp 0</div>
                    </div>
                    <div>
                        <div class="text-sm text-gray-500 uppercase tracking-wider">Jumlah Item Pekerjaan</div>
                        <div id="jumlahItemDisplay" class="text-3xl font-bold text-gray-700 mt-1">0 Item</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIKA APLIKASI -->
    <script>
        let barisCounter = 0;

        // Fungsi untuk menambahkan baris baru ke tabel
        function tambahBaris() {
            barisCounter++;
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${barisCounter}</td>
                <td><input type="text" class="nama-item" placeholder="Contoh: Besi D13"></td>
                <td><input type="number" class="volume" step="0.01" min="0" placeholder="0"></td>
                <td><input type="text" class="satuan" placeholder="kg / m² / unit"></td>
                <td><input type="number" class="harga-satuan" step="100" min="0" placeholder="25000"></td>
                <td><span class="subtotal font-bold text-gray-700">0</span></td>
                <td><button onclick="hapusBaris(this)" class="btn-danger text-white px-2 py-1 rounded text-xs">Hapus</button></td>
            `;
            tbody.appendChild(tr);
            
            // Event listener untuk kalkulasi otomatis per baris saat user mengetik
            const inputs = tr.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('input', function() {
                    hitungBaris(this.closest('tr'));
                });
            });
        }

        // Fungsi untuk menghitung subtotal per baris
        function hitungBaris(row) {
            const volume = parseFloat(row.querySelector('.volume').value) || 0;
            const hargaSatuan = parseFloat(row.querySelector('.harga-satuan').value) || 0;
            const subtotal = volume * hargaSatuan;
            row.querySelector('.subtotal').innerText = subtotal.toLocaleString('id-ID', {minimumFractionDigits: 0});
            
            // Otomatis hitung grand total setiap kali ada perubahan
            hitungSemua();
        }

        // Fungsi untuk menghitung total keseluruhan
        function hitungSemua() {
            const rows = document.querySelectorAll('#tableBody tr');
            let grandTotal = 0;
            let count = 0;

            rows.forEach(row => {
                const volume = parseFloat(row.querySelector('.volume').value) || 0;
                const hargaSatuan = parseFloat(row.querySelector('.harga-satuan').value) || 0;
                grandTotal += (volume * hargaSatuan);
                count++;
            });

            // Update tampilan Grand Total
            document.getElementById('grandTotalDisplay').innerText = 'Rp ' + grandTotal.toLocaleString('id-ID', {minimumFractionDigits: 0});
            document.getElementById('jumlahItemDisplay').innerText = count + ' Item';
        }

        // Fungsi untuk menghapus satu baris
        function hapusBaris(btn) {
            const row = btn.closest('tr');
            row.remove();
            hitungSemua(); // Update total setelah hapus
            // Update nomor urut (opsional)
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach((row, index) => {
                row.cells[0].innerText = index + 1;
            });
            barisCounter = rows.length;
        }

        // Fungsi untuk mereset aplikasi ke kondisi kosong
        function resetForm() {
            document.getElementById('namaProyek').value = '';
            document.getElementById('namaKlien').value = '';
            document.getElementById('tableBody').innerHTML = '';
            document.getElementById('grandTotalDisplay').innerText = 'Rp 0';
            document.getElementById('jumlahItemDisplay').innerText = '0 Item';
            barisCounter = 0;
        }

        // Inisialisasi: Tambah 1 baris otomatis saat halaman dimuat
        window.onload = function() {
            tambahBaris();
        };
    </script>
</body>
</html>
