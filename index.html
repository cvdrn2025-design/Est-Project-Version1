<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimator Proyek Premium</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

    <style>
        /* Ganti font default menjadi Inter */
        body { font-family: 'Inter', sans-serif; }
        
        .table-input { width: 100%; border-collapse: collapse; }
        .table-input th, .table-input td { padding: 12px 10px; border-bottom: 1px solid #e5e7eb; text-align: center; vertical-align: middle; }
        .table-input th { background-color: #f8fafc; color: #475569; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .table-input tr:last-child td { border-bottom: none; }
        .table-input tr:hover { background-color: #f8fafc; }
        
        input[type="number"], input[type="text"] { width: 100%; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 6px; background-color: white; transition: all 0.2s; }
        input[type="number"]:focus, input[type="text"]:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        
        .btn { color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; border: none; transition: all 0.2s ease-in-out; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .btn:active { transform: translateY(1px); }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .btn-primary:hover { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-success:hover { background: linear-gradient(135deg, #059669, #047857); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-warning:hover { background: linear-gradient(135deg, #d97706, #b45309); }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-gray { background: #6b7280; }
        .btn-gray:hover { background: #4b5563; }
        .btn-sm { padding: 4px 10px; font-size: 0.75rem; }

        select { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; background-color: white; transition: all 0.2s; }
        select:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }

        .toast-msg { position: fixed; bottom: 20px; right: 20px; padding: 16px 24px; border-radius: 12px; color: white; z-index: 50; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; transform: translateY(20px); pointer-events: none; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .toast-show { opacity: 1; transform: translateY(0); pointer-events: auto; }

        @media print { .no-print { display: none !important; } body { background: white; } .bg-gradient-to-r { background: #1f2937 !important; } input { border: none !important; background: transparent !important; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans text-slate-800">

    <!-- Toast Notification Premium -->
    <div id="toast" class="toast-msg bg-slate-900 shadow-xl border border-slate-700"></div>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto">
        
        <!-- Header Premium -->
        <header class="bg-gradient-to-r from-slate-900 to-slate-800 rounded-2xl p-6 md:p-8 mb-6 shadow-xl shadow-slate-900/10 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-slate-700/20 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
            <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-white flex items-center gap-3">
                        <span class="text-indigo-400">📂</span> Estimator Proyek
                    </h1>
                    <p class="text-slate-400 text-sm mt-1">Multi-proyek, simpan dengan nama unik, ekspor Excel & cetak PDF.</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 gap-6">
            
            <!-- Card: Identitas & Kontrol Proyek -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Proyek (Nama File)</label>
                        <div class="flex gap-2">
                            <input type="text" id="namaProyek" placeholder="Contoh: Rumah Pak Heri" class="flex-1 border-slate-200 shadow-sm rounded-lg focus:ring-indigo-500">
                            <button onclick="tambahProyekBaru()" class="btn btn-success">➕ Baru</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Pilih Proyek Tersimpan</label>
                        <select id="pilihProyek" class="w-full border-slate-200 shadow-sm rounded-lg bg-white">
                            <option value="">-- Pilih Proyek --</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Card: Tabel Input -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 overflow-hidden">
                <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center gap-2"><span class="text-indigo-500">📋</span> Daftar Pekerjaan</h2>
                
                <div class="overflow-x-auto border border-slate-100 rounded-lg">
                    <table class="table-input w-full text-sm" id="itemTable">
                        <thead>
                            <tr>
                                <th style="width: 5%;">No</th>
                                <th style="width: 35%; text-align: left; padding-left: 16px;">Nama Pekerjaan</th>
                                <th style="width: 15%;">Volume</th>
                                <th style="width: 15%;">Satuan</th>
                                <th style="width: 15%;">Harga Satuan</th>
                                <th style="width: 15%;">Total Harga</th>
                                <th class="no-print" style="width: 5%;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>

                <!-- Action Buttons Bar -->
                <div class="mt-5 flex flex-wrap gap-3 no-print">
                    <button onclick="tambahBaris()" class="btn btn-success">➕ Tambah Baris</button>
                    <button onclick="resetProyek()" class="btn btn-gray">🔄 Reset Proyek</button>
                    
                    <div class="flex-1 md:text-right mt-2 md:mt-0 flex flex-wrap gap-2 justify-end">
                        <button onclick="exportToExcel()" class="btn btn-warning">📥 Export Excel</button>
                        <button onclick="window.print()" class="btn bg-teal-500 hover:bg-teal-600">🖨️ Print / PDF</button>
                    </div>
                </div>
            </div>

            <!-- Card: Simpan & Ambil (Terintegrasi) -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 no-print">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Save Group -->
                    <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                        <span class="text-sm font-semibold text-indigo-700 min-w-[60px]">Simpan</span>
                        <select id="simpanTarget" class="flex-1 border-indigo-200 rounded-md shadow-sm text-sm bg-white">
                            <option value="browser" selected>💾 Ke Browser</option>
                            <option value="server">☁️ Ke Server</option>
                        </select>
                        <button onclick="simpanData()" class="btn btn-primary w-full sm:w-auto">Simpan Data</button>
                    </div>

                    <!-- Load Group -->
                    <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center bg-purple-50/50 p-4 rounded-xl border border-purple-100">
                        <span class="text-sm font-semibold text-purple-700 min-w-[60px]">Ambil</span>
                        <select id="ambilSource" class="flex-1 border-purple-200 rounded-md shadow-sm text-sm bg-white">
                            <option value="browser" selected>📂 Dari Browser</option>
                            <option value="server">📂 Dari Server</option>
                        </select>
                        <button onclick="ambilData()" class="btn bg-purple-600 hover:bg-purple-700 w-full sm:w-auto">Ambil Data</button>
                    </div>
                </div>
            </div>

            <!-- Card: Grand Total Premium -->
            <div class="bg-gradient-to-r from-slate-50 to-slate-100 rounded-xl border border-slate-200 p-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <div class="text-sm text-slate-500 font-medium uppercase tracking-wider">Grand Total Proyek</div>
                        <div id="grandTotalDisplay" class="text-3xl md:text-4xl font-bold text-slate-800 mt-1">Rp 0</div>
                    </div>
                    <div class="bg-white px-6 py-3 rounded-lg shadow-sm border border-slate-200">
                        <div class="text-xs text-slate-500 uppercase tracking-wider">Total Item</div>
                        <div id="jumlahItemDisplay" class="text-xl font-bold text-indigo-600 text-center">0 Item</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIKA (SAMA SEPERTI SEBELUMNYA, TIDAK ADA PERUBAHAN FUNGSI) -->
    <script>
        let barisCounter = 0;
        const API_URL = 'http://localhost:3000';

        function showToast(msg, color = 'bg-slate-900') {
            const t = document.getElementById('toast');
            t.className = `toast-msg ${color} shadow-xl border border-slate-700`;
            t.innerText = msg;
            setTimeout(() => t.classList.add('toast-show'), 10);
            setTimeout(() => t.classList.remove('toast-show'), 3500);
        }

        function tambahBaris() {
            barisCounter++;
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-slate-500 font-medium">${barisCounter}</td>
                <td style="text-align: left; padding-left: 16px;"><input type="text" class="nama-item" placeholder="Contoh: Besi D13"></td>
                <td><input type="number" class="volume" step="0.01" min="0" placeholder="0"></td>
                <td><input type="text" class="satuan" placeholder="kg / m²"></td>
                <td><input type="number" class="harga-satuan" step="100" min="0" placeholder="0"></td>
                <td><span class="subtotal font-semibold text-slate-700">0</span></td>
                <td class="no-print"><button onclick="hapusBaris(this)" class="btn btn-danger btn-sm">Hapus</button></td>
            `;
            tbody.appendChild(tr);
            tr.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', function() { hitungBaris(this.closest('tr')); });
            });
            hitungSemua();
        }

        function hitungBaris(row) {
            const volume = parseFloat(row.querySelector('.volume').value) || 0;
            const hargaSatuan = parseFloat(row.querySelector('.harga-satuan').value) || 0;
            row.querySelector('.subtotal').innerText = (volume * hargaSatuan).toLocaleString('id-ID', {minimumFractionDigits: 0});
            hitungSemua();
        }

        function hapusBaris(btn) {
            const row = btn.closest('tr');
            row.remove();
            document.querySelectorAll('#tableBody tr').forEach((r, i) => r.cells[0].innerText = i + 1);
            barisCounter = document.querySelectorAll('#tableBody tr').length;
            hitungSemua();
        }

        function hitungSemua() {
            let grandTotal = 0;
            document.querySelectorAll('#tableBody tr').forEach(row => {
                const v = parseFloat(row.querySelector('.volume').value) || 0;
                const h = parseFloat(row.querySelector('.harga-satuan').value) || 0;
                grandTotal += v * h;
            });
            document.getElementById('grandTotalDisplay').innerText = 'Rp ' + grandTotal.toLocaleString('id-ID', {minimumFractionDigits: 0});
            document.getElementById('jumlahItemDisplay').innerText = document.querySelectorAll('#tableBody tr').length + ' Item';
        }

        function resetProyek() {
            if(!confirm('Yakin ingin mereset proyek ini? Semua data akan dihapus.')) return;
            document.getElementById('namaProyek').value = '';
            document.getElementById('namaKlien').value = '';
            document.getElementById('tableBody').innerHTML = '';
            document.getElementById('grandTotalDisplay').innerText = 'Rp 0';
            document.getElementById('jumlahItemDisplay').innerText = '0 Item';
            barisCounter = 0;
            tambahBaris();
            showToast('Proyek direset!', 'bg-blue-600');
        }

        function getTableData() {
            const data = [];
            document.querySelectorAll('#tableBody tr').forEach(row => {
                data.push({
                    nama: row.querySelector('.nama-item').value,
                    volume: parseFloat(row.querySelector('.volume').value) || 0,
                    satuan: row.querySelector('.satuan').value,
                    hargaSatuan: parseFloat(row.querySelector('.harga-satuan').value) || 0,
                    total: (parseFloat(row.querySelector('.volume').value) || 0) * (parseFloat(row.querySelector('.harga-satuan').value) || 0)
                });
            });
            return data;
        }

        function loadDataToTable(data) {
            document.getElementById('tableBody').innerHTML = '';
            barisCounter = 0;
            data.items.forEach(item => {
                tambahBaris();
                const row = document.querySelector('#tableBody tr:last-child');
                row.querySelector('.nama-item').value = item.nama || '';
                row.querySelector('.volume').value = item.volume || 0;
                row.querySelector('.satuan').value = item.satuan || '';
                row.querySelector('.harga-satuan').value = item.hargaSatuan || 0;
                hitungBaris(row);
            });
            document.getElementById('namaProyek').value = data.namaProyek || '';
            document.getElementById('namaKlien').value = data.namaKlien || '';
            hitungSemua();
        }

        function updateDropdownList() {
            const select = document.getElementById('pilihProyek');
            const list = JSON.parse(localStorage.getItem('proyekList')) || [];
            select.innerHTML = '<option value="">-- Pilih Proyek --</option>';
            list.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                select.appendChild(opt);
            });
        }

        function tambahProyekBaru() {
            document.getElementById('namaProyek').value = '';
            document.getElementById('namaKlien').value = '';
            document.getElementById('tableBody').innerHTML = '';
            document.getElementById('grandTotalDisplay').innerText = 'Rp 0';
            document.getElementById('jumlahItemDisplay').innerText = '0 Item';
            barisCounter = 0;
            tambahBaris();
            showToast('Proyek baru siap!', 'bg-success');
        }

        function simpanData() {
            const target = document.getElementById('simpanTarget').value;
            if (target === 'browser') simpanKeLocal();
            else if (target === 'server') simpanKeServer();
        }

        function simpanKeLocal() {
            const proyekName = document.getElementById('namaProyek').value.trim();
            if (!proyekName) return showToast('Nama Proyek wajib diisi!', 'bg-red-600');

            const data = { namaProyek: proyekName, namaKlien: document.getElementById('namaKlien').value, items: getTableData() };
            localStorage.setItem('proyek_' + proyekName, JSON.stringify(data));

            let list = JSON.parse(localStorage.getItem('proyekList')) || [];
            if (!list.includes(proyekName)) {
                list.push(proyekName);
                localStorage.setItem('proyekList', JSON.stringify(list));
                updateDropdownList();
            }
            showToast('Tersimpan: "' + proyekName + '"!', 'bg-indigo-800');
        }

        function ambilData() {
            const source = document.getElementById('ambilSource').value;
            if (source === 'browser') ambilDariLocal();
            else if (source === 'server') ambilDariServer();
        }

        function ambilDariLocal() {
            const selectedName = document.getElementById('pilihProyek').value;
            if (!selectedName) return showToast('Pilih proyek di dropdown!', 'bg-red-600');
            const raw = localStorage.getItem('proyek_' + selectedName);
            if (!raw) return showToast('Data "' + selectedName + '" tidak ditemukan.', 'bg-red-600');
            loadDataToTable(JSON.parse(raw));
            showToast('Memuat "' + selectedName + '"!', 'bg-purple-600');
        }

        async function simpanKeServer() {
            const data = { namaProyek: document.getElementById('namaProyek').value, namaKlien: document.getElementById('namaKlien').value, items: getTableData() };
            try {
                const res = await fetch(`${API_URL}/save`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                const result = await res.json();
                showToast(result.message || 'Tersimpan ke Server!', 'bg-indigo-600');
            } catch (err) { showToast('Gagal ke Server. Pastikan Node.js berjalan.', 'bg-red-600'); }
        }

        async function ambilDariServer() {
            try {
                const res = await fetch(`${API_URL}/load`);
                const data = await res.json();
                if (!data.items || data.items.length === 0) return showToast('Server kosong.', 'bg-red-600');
                loadDataToTable(data);
                showToast('Dimuat dari Server!', 'bg-indigo-600');
            } catch (err) { showToast('Gagal ambil dari Server.', 'bg-red-600'); }
        }

        function exportToExcel() {
            const rows = document.querySelectorAll('#tableBody tr');
            if (rows.length === 0) return showToast('Tidak ada data!', 'bg-red-600');

            const dataForExcel = [['No', 'Nama Pekerjaan', 'Volume', 'Satuan', 'Harga Satuan (Rp)', 'Total Harga (Rp)']];
            rows.forEach(row => {
                const no = row.cells[0].innerText;
                const nama = row.querySelector('.nama-item').value;
                const volume = row.querySelector('.volume').value;
                const satuan = row.querySelector('.satuan').value;
                const harga = row.querySelector('.harga-satuan').value;
                const total = row.querySelector('.subtotal').innerText.replace(/\./g, '');
                dataForExcel.push([no, nama, volume, satuan, harga, total]);
            });
            dataForExcel.push(['', '', '', '', 'GRAND TOTAL', document.getElementById('grandTotalDisplay').innerText]);

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(dataForExcel);
            ws['!cols'] = [{ wch: 5 }, { wch: 40 }, { wch: 15 }, { wch: 15 }, { wch: 20 }, { wch: 20 }];
            XLSX.utils.book_append_sheet(wb, ws, "Estimasi Proyek");
            XLSX.writeFile(wb, `Estimasi_${document.getElementById('namaProyek').value || 'Proyek'}.xlsx`);
            showToast('Berhasil Export Excel!', 'bg-yellow-600');
        }

        window.onload = function() {
            updateDropdownList();
            tambahBaris();
            const saved = localStorage.getItem('estimatorProjectData'); // Fallback
            if (saved) loadDataToTable(JSON.parse(saved));
        };
    </script>
</body>
    </html>
